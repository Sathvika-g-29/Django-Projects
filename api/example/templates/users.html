<!DOCTYPE html>
<html>
    <head>
        <title>User Table</title>
    </head>
    <body>
        <h2>User List</h2>
        <table border="1" cellpadding="10">
            <tr>
                <th>Name</th>
                <th>Email</th>
            </tr>
            {% for user in users%}
                <tr>
                    <td>{{user.name}}</td>
                    <td>{{user.email}}</td>
                </tr>
                {%endfor%}
        </table>
    </body>
</html>
